services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly
      POSTGRES_DB: gatherly
    ports:
      - "5432:5432"
    volumes:
      - gatherly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherly -d gatherly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gatherly_pg:
